name: Objetivos 1 y 2 - pruebas de octree y HCE

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-objetivo1.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-objetivo1.txt
      - name: Ejecutar pruebas
        run: python -m pytest
